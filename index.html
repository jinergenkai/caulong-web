<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#256E4E" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23256E4E'/%3E%3Cpath d='M5 18.5c1.4-1 3.8-3.3 6.1-5.6' stroke='white' stroke-width='1.7' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='16.5' cy='7.5' r='3.4' fill='none' stroke='white' stroke-width='1.5'/%3E%3Cpath d='M14.1 5.1l4.8 4.8M16.5 4.1v6.8M13.1 7.5h6.8' stroke='white' stroke-width='.9'/%3E%3C/svg%3E" />
<title>Sổ Cầu Lông</title>
<style>
  :root{
    --paper:#F6F7F4; --card:#FFFFFF; --ink:#17211D; --soft:#5A655E;
    --line:#E2E6DF; --court:#256E4E; --court-tint:#E8F0EB; --court-line:#BFD8CB;
    --amber:#B7601F; --amber-tint:#F7ECE1; --danger:#B23B3B;
    --radius:14px;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"Roboto Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;}
  .wrap{max-width:600px;margin:0 auto;padding:0 14px 120px;}

  header{position:sticky;top:0;z-index:20;background:var(--paper);
    border-bottom:1px solid var(--line);padding:11px 0 9px;margin-bottom:14px;}
  .head-row{display:flex;align-items:center;gap:10px;max-width:600px;margin:0 auto;padding:0 14px;}
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
  .brand h1{font-size:17px;margin:0;letter-spacing:-.2px;font-weight:700;}
  .stamp{font-size:11px;color:var(--soft);font-family:var(--mono);text-align:right;line-height:1.35;}
  .stamp b{color:var(--court);}
  .stamp.warn b{color:var(--amber);}

  .tabs{display:flex;gap:4px;background:var(--court-tint);border-radius:12px;padding:4px;}
  .tab{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:13.5px;font-weight:600;
    color:var(--court);cursor:pointer;border:none;background:transparent;font-family:inherit;}
  .tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(23,33,29,.08);}

  h2.sec{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--soft);margin:22px 2px 8px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .card.done{background:#FBFCFA;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .muted{color:var(--soft);} .small{font-size:12.5px;} .tiny{font-size:11.5px;}
  .due{color:var(--amber);} .ok{color:var(--court);} .b{font-weight:700;}
  .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  button.primary{background:var(--court);color:#fff;border:none;border-radius:11px;
    padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;width:100%;font-family:inherit;}
  button.primary[disabled]{background:var(--line);color:var(--soft);cursor:default;}
  button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  button.ghost.mini{padding:6px 10px;font-size:12.5px;}
  .link{color:var(--court);cursor:pointer;font-weight:600;font-size:13px;background:none;border:none;padding:4px;font-family:inherit;}
  .del{color:var(--danger);}

  input[type=text],input[type=number],input[type=password],input[type=search]{
    font-family:inherit;font-size:15px;color:var(--ink);background:var(--paper);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;}
  input:focus{outline:2px solid var(--court);outline-offset:-1px;border-color:var(--court);}
  label.fld{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin:0 0 4px 2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .av{border-radius:50%;flex:0 0 auto;object-fit:cover;display:inline-flex;align-items:center;
    justify-content:center;font-weight:700;color:#fff;overflow:hidden;vertical-align:middle;
    box-shadow:inset 0 0 0 1px rgba(23,33,29,.09);}
  button.avbtn{padding:0;border:none;background:none;cursor:pointer;flex:0 0 auto;line-height:0;
    border-radius:50%;font-family:inherit;}
  button.avbtn.arm{outline:2px solid var(--amber);outline-offset:2px;}
  button.avbtn.drop{outline:2px dashed var(--court);outline-offset:2px;}
  button.picbtn{padding:0;border:none;background:none;cursor:pointer;flex:0 0 auto;line-height:0;
    border-radius:10px;font-family:inherit;}
  button.picbtn:active{transform:scale(.96);}
  button.picbtn img{border-radius:10px;object-fit:cover;box-shadow:inset 0 0 0 1px rgba(23,33,29,.12);}
  button.picbtn.arm{outline:2px solid var(--amber);outline-offset:2px;}
  button.picbtn.drop{outline:2px dashed var(--court);outline-offset:2px;}
  .picph{border:1.5px dashed var(--court-line);border-radius:10px;display:flex;align-items:center;
    justify-content:center;color:var(--court-line);font-size:19px;font-weight:700;line-height:1;}
  .picbar{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:70;
    background:var(--ink);color:#fff;border-radius:13px;padding:9px 11px;font-size:12.5px;
    display:flex;align-items:center;gap:9px;box-shadow:0 8px 24px rgba(23,33,29,.3);max-width:min(94vw,520px);}
  .picbar button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;
    padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex:0 0 auto;}
  .picbar kbd{background:rgba(255,255,255,.16);border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:11px;}

  .stat{background:linear-gradient(180deg,#fff,var(--court-tint));border-color:var(--court-line);}
  .stat .big{font-size:27px;font-weight:700;letter-spacing:-.5px;line-height:1.15;}
  .bar{height:6px;background:var(--paper);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:9px 0 7px;}
  .bar>i{display:block;height:100%;background:var(--court);border-radius:99px;transition:width .25s;}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
  .fp{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;
    font-size:12.5px;font-weight:600;color:var(--soft);cursor:pointer;font-family:inherit;}
  .fp.on{background:var(--ink);border-color:var(--ink);color:#fff;}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--paper);
    border-radius:99px;padding:4px 11px 4px 4px;font-size:12.5px;font-weight:600;color:var(--ink);
    font-family:inherit;line-height:1.35;}
  button.chip{cursor:pointer;} button.chip:active{transform:scale(.97);}
  .chip.on{background:var(--court-tint);border-color:var(--court-line);color:var(--court);}
  .chip.on .nm2{text-decoration:line-through;opacity:.7;}
  .chip.me{background:var(--amber-tint);border-color:var(--amber);color:var(--amber);}

  .pp{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid var(--line);}
  .pp:last-child{border-bottom:none;}
  .pp .chk{width:22px;height:22px;flex:0 0 auto;border-radius:6px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
  .pp .chk.on{background:var(--court);border-color:var(--court);}
  .pp .nm{flex:1;min-width:0;}
  .wbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;font-family:var(--mono);
    font-size:13px;padding:5px 9px;cursor:pointer;color:var(--soft);font-weight:600;}
  .wbtn.on{background:var(--court-tint);color:var(--court);border-color:var(--court);}
  .wnum{width:54px;text-align:center;padding:6px 4px !important;font-family:var(--mono);}

  .pill{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--amber-tint);
    color:var(--amber);border-radius:6px;padding:1px 6px;font-weight:600;vertical-align:1px;}
  .pill.green{background:var(--court-tint);color:var(--court);}
  .flag{font-size:12px;color:var(--danger);margin-top:4px;}

  .srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
  .srow .sdate{width:62px;flex:0 0 auto;font-weight:600;font-size:13px;}
  .srow .samt{flex:1;text-align:right;font-size:13px;}
  .toggle{border:1px solid var(--line);background:var(--card);border-radius:99px;font-size:11.5px;
    font-weight:700;padding:5px 10px;cursor:pointer;color:var(--soft);font-family:inherit;flex:0 0 auto;}
  .toggle.on{background:var(--court);border-color:var(--court);color:#fff;}

  .selrow{display:flex;align-items:center;gap:10px;padding:8px 11px;margin-bottom:6px;border-radius:11px;
    cursor:pointer;border:1px solid var(--line);background:var(--card);}
  .selrow.sel{border:2px solid var(--court);background:var(--court-tint);padding:7px 10px;}
  .selrow .sq{width:20px;height:20px;flex:0 0 auto;border-radius:5px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
  .selrow.sel .sq{background:var(--court);border-color:var(--court);}

  /* người xem */
  .picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;margin-top:10px;}
  .pcell{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 6px 9px;
    text-align:center;cursor:pointer;font-family:inherit;color:var(--ink);}
  .pcell:active{transform:scale(.97);}
  .pcell.owe{border-color:var(--amber-tint);background:#FFFDFA;}
  .pcell .nm3{font-size:12.5px;font-weight:600;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pcell .amt{font-size:11.5px;font-family:var(--mono);margin-top:2px;}

  .hero{background:linear-gradient(160deg,#fff,var(--court-tint));border:1px solid var(--court-line);
    border-radius:18px;padding:20px 18px;margin-bottom:12px;text-align:center;}
  .hero .huge{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;font-family:var(--mono);}
  .hero .sub{font-size:13px;color:var(--soft);margin-top:4px;}
  .copyrow{display:flex;gap:8px;align-items:center;background:var(--paper);border:1px dashed var(--court-line);
    border-radius:10px;padding:9px 11px;margin-top:10px;}
  .copyrow code{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .qrimg{max-width:210px;width:62%;border-radius:12px;margin-top:10px;}

  .banner{border-radius:11px;padding:9px 12px;font-size:12.5px;margin-bottom:10px;}
  .banner.off{background:var(--amber-tint);color:var(--amber);}
  .banner.err{background:#F6E7E7;color:var(--danger);}
  .hint{font-size:12px;color:var(--soft);background:var(--court-tint);border-radius:10px;padding:9px 11px;margin-bottom:12px;}
  .empty{padding:26px 16px;text-align:center;color:var(--soft);font-size:13px;}
  .hide{display:none;}
  footer{max-width:600px;margin:0 auto;padding:24px 14px 40px;text-align:center;}

  /* thanh lưu của admin */
  .savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:55;
    background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;font-size:12.5px;
    display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(23,33,29,.28);max-width:min(94vw,540px);}
  .savebar.err{background:var(--danger);}
  .savebar button{background:transparent;border:1px solid rgba(255,255,255,.42);color:#fff;border-radius:8px;
    padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex:0 0 auto;}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:#8FD3AE;}
  .dot.wait{background:#E8C07A;} .dot.bad{background:#F2A0A0;}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:60;
    background:var(--ink);color:#fff;border-radius:12px;padding:11px 13px;font-size:13.5px;
    display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(23,33,29,.25);max-width:min(92vw,520px);}
  .toast button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;
    padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;flex:0 0 auto;}

  .modal{position:fixed;inset:0;z-index:80;background:rgba(23,33,29,.55);display:flex;
    align-items:center;justify-content:center;padding:16px;}
  .sheet{background:var(--card);border-radius:16px;padding:16px;max-width:520px;width:100%;
    max-height:88vh;overflow:auto;}
  .sheet img{width:100%;border-radius:10px;display:block;}
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" aria-hidden="true">
        <path d="M4 19c1.5-1 4-3.5 6.5-6S15 8 16 6.5" stroke="#256E4E" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="17.5" cy="5.5" rx="3.4" ry="3.4" fill="#E8F0EB" stroke="#256E4E" stroke-width="1.4"/>
        <path d="M15.4 3.4l4.2 4.2M17.5 2.1v6.8M14.1 5.5h6.8" stroke="#256E4E" stroke-width="1"/>
        <circle cx="4" cy="19" r="1.6" fill="#B7601F"/>
      </svg>
      <h1>Sổ Cầu Lông</h1>
    </div>
    <div class="stamp" id="stamp"></div>
  </div>
  <div class="head-row" style="margin-top:8px;"><div class="tabs" id="tabs" style="width:100%"></div></div>
</header>

<div class="wrap"><div id="app"><div class="card"><div class="empty">Đang tải sổ…</div></div></div></div>
<footer id="foot"></footer>
<div id="overlay"></div>
<div id="pic-bar"></div>
<input type="file" id="av-file" accept="image/*" class="hide" />
<input type="file" id="json-file" accept="application/json,.json" class="hide" />
<input type="file" id="qr-file" accept="image/*" class="hide" />

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════
   1. LÕI — model + tính tiền.  Giống hệt app gốc, không đổi công thức.
   ══════════════════════════════════════════════════════════════════ */
const DEFAULT_PRICE=30, LEGACY="legacy", AV_SIZE=96, PHOTO_SIZE=340, LOG_MAX=250, EPS=0.05;
const CACHE_KEY="caulong_cache", PASS_KEY="caulong_pass", ME_KEY="caulong_me";

function id(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3); }
const esc=t=>(t==null?"":String(t)).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const round1=x=>Math.round(x*10)/10;
const numStr=x=>{ const r=round1(x)+0; return Number.isInteger(r)?String(r):r.toFixed(1); };
const fmt=x=>numStr(x)+"k";
const vnd=x=>Math.round(x*1000).toLocaleString("vi-VN")+" đ";
/* bỏ dấu để gõ "hung" vẫn tìm ra "Hùng" */
const norm=s=>String(s||"").toLowerCase().normalize("NFD")
  .replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");

/* Nâng đời dữ liệu: v1 (paid theo tên) → v2 (paid theo buổi) → v3 (khóa theo id).
   Luôn chạy trên bản sao, ném lỗi thì dữ liệu đang dùng không suy suyển. */
function migrate(o){
  if(!o||typeof o!=="object") throw new Error("dữ liệu không phải object");
  if(!Array.isArray(o.sessions)) throw new Error("thiếu danh sách buổi chơi");
  if(!Array.isArray(o.members)) throw new Error("thiếu danh sách thành viên");
  o.flags=(o.flags&&typeof o.flags==="object"&&!Array.isArray(o.flags))?o.flags:{};
  o.qr=typeof o.qr==="string"?o.qr:"";
  o.note=typeof o.note==="string"?o.note:"";
  o.log=Array.isArray(o.log)?o.log.filter(e=>e&&e.t&&e.m).slice(-LOG_MAX):[];
  o.sessions.forEach(s=>{
    s.id=s.id||id(); s.date=s.date==null?"":String(s.date);
    s.court=+s.court||0; s.shuttles=+s.shuttles||0; s.price=+s.price||DEFAULT_PRICE;
    s.parts=Array.isArray(s.parts)?s.parts:[];
    s.photo=typeof s.photo==="string"?s.photo:"";     // ảnh buổi chơi, để lâu còn nhớ
    if(!s.paid||typeof s.paid!=="object"||Array.isArray(s.paid)) s.paid={};
  });
  if(o.paid&&typeof o.paid==="object"&&!Array.isArray(o.paid)){
    Object.keys(o.paid).forEach(n=>{ if(!o.paid[n])return;
      o.sessions.forEach(s=>{ if(s.parts.some(p=>p.name===n)&&!s.paid[n]) s.paid[n]=LEGACY; }); });
    delete o.paid;
  }
  if(!(o.v>=3)){
    const byName=new Map();
    o.members=o.members.map(m=>{
      const mm=(typeof m==="string")?{id:id(),name:m,av:""}
        :{id:m.id||id(),name:String(m.name||"?"),av:typeof m.av==="string"?m.av:""};
      if(!byName.has(mm.name)) byName.set(mm.name,mm.id);
      return mm;
    });
    const midOf=n=>{ if(byName.has(n)) return byName.get(n);
      const mm={id:id(),name:String(n),av:""}; o.members.push(mm); byName.set(mm.name,mm.id); return mm.id; };
    const remap=ob=>{ const out={}; Object.keys(ob).forEach(k=>{ out[byName.has(k)?byName.get(k):k]=ob[k]; }); return out; };
    o.sessions.forEach(s=>{
      s.parts=s.parts.map(p=>p.mid?{mid:p.mid,weight:+p.weight||0}:{mid:midOf(p.name),weight:+p.weight||0});
      s.paid=remap(s.paid);
    });
    o.flags=remap(o.flags);
  } else {
    o.members=o.members.map(m=>({id:m.id||id(),name:String(m.name||"?"),av:typeof m.av==="string"?m.av:""}));
  }
  const ids=new Set(o.members.map(m=>m.id));
  o.sessions.forEach(s=>{
    const seen=new Set();
    s.parts=s.parts.filter(p=>{ if(!ids.has(p.mid)||seen.has(p.mid))return false; seen.add(p.mid); return true; });
    Object.keys(s.paid).forEach(k=>{ if(!seen.has(k)) delete s.paid[k]; });
  });
  Object.keys(o.flags).forEach(k=>{ if(!ids.has(k)) delete o.flags[k]; });
  o.v=3;
  return o;
}

const sTotal=s=>s.court+s.shuttles*(s.price||DEFAULT_PRICE);
const sWeight=s=>s.parts.reduce((a,p)=>a+(+p.weight||0),0);
const sPerUnit=s=>{ const w=sWeight(s); return w>0?sTotal(s)/w:0; };
const shareIn=(s,mid)=>{ const p=s.parts.find(x=>x.mid===mid); return p?p.weight*sPerUnit(s):0; };
const isPaid=(s,mid)=>!!(s.paid&&s.paid[mid]);
function setPaid(s,mid,on){ if(!s.paid)s.paid={}; if(on) s.paid[mid]=new Date().toISOString(); else delete s.paid[mid]; }
const sUnpaid=s=>s.parts.filter(p=>!isPaid(s,p.mid)).map(p=>p.mid);
const sDue=s=>s.parts.reduce((a,p)=>a+(isPaid(s,p.mid)?0:p.weight*sPerUnit(s)),0);
const sCollected=s=>s.parts.reduce((a,p)=>a+(isPaid(s,p.mid)?p.weight*sPerUnit(s):0),0);
const sSettled=s=>s.parts.length>0&&sUnpaid(s).length===0;
const memById=mid=>st.members.find(m=>m.id===mid);
const memberSessions=mid=>st.sessions.filter(s=>s.parts.some(p=>p.mid===mid));
const memberDueSessions=mid=>memberSessions(mid).filter(s=>!isPaid(s,mid));
const memberDue=mid=>memberDueSessions(mid).reduce((a,s)=>a+shareIn(s,mid),0);
const memberPaidSum=mid=>memberSessions(mid).filter(s=>isPaid(s,mid)).reduce((a,s)=>a+shareIn(s,mid),0);
const totalDue=()=>st.sessions.reduce((a,s)=>a+sDue(s),0);
const totalCollected=()=>st.sessions.reduce((a,s)=>a+sCollected(s),0);
const debtors=()=>st.members.filter(m=>memberDue(m.id)>EPS);
const orderedSessions=()=>st.sessions.slice().reverse();
function whenLabel(v){ if(!v||v===LEGACY)return""; const d=new Date(v); return isNaN(d)?"":d.getDate()+"/"+(d.getMonth()+1); }
function dupTag(m){ const same=st.members.filter(x=>x.name===m.name); return same.length<2?"":" #"+(same.indexOf(m)+1); }
const fullName=m=>m.name+dupTag(m);
function initials(n){ const w=String(n||"").trim().split(/\s+/).filter(Boolean);
  return !w.length?"?":(w.length>1?w[w.length-2][0]+w[w.length-1][0]:w[0].slice(0,2)).toUpperCase(); }
function hue(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return `hsl(${h} 42% 52%)`; }
function avatarHTML(m,size){
  const s=size||36, box=`width:${s}px;height:${s}px;min-width:${s}px`;
  return m.av?`<img class="av" src="${esc(m.av)}" style="${box}" alt="">`
    :`<span class="av" style="${box};font-size:${Math.max(9,Math.round(s*.36))}px;background:${hue(m.id)}">${esc(initials(m.name))}</span>`;
}
/* nội dung chuyển khoản chuẩn hóa — để bạn đối soát sao kê */
function payRef(m){ return ("CAULONG "+norm(m.name).replace(/[^a-z0-9]+/g," ").trim().toUpperCase()).slice(0,40); }

/* ══════════════════════════════════════════════════════════════════
   2. KHO — nói chuyện với /api/data
   ══════════════════════════════════════════════════════════════════ */
let st=null, rev=0, updatedAt=null;
let online=true, loadErr="", fromCache=false;
let isAdmin=false, pass="";

function readCache(){
  try{ const raw=localStorage.getItem(CACHE_KEY); if(!raw)return null; return JSON.parse(raw); }catch(e){ return null; }
}
function writeCache(){
  try{ localStorage.setItem(CACHE_KEY,JSON.stringify({rev,updatedAt,data:st,dirty})); }catch(e){}
}
async function fetchData(){
  const r=await fetch("api/data",{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  st=migrate(j.data); rev=j.rev||0; updatedAt=j.updatedAt||null;
  online=true; loadErr=""; fromCache=false; writeCache();
}
async function boot(){
  const c=readCache();
  let unsaved=false;
  if(c){ try{ st=migrate(c.data); rev=c.rev||0; updatedAt=c.updatedAt||null;
    fromCache=true; unsaved=!!c.dirty; render(); }catch(e){} }
  if(typeof window.__DATA__!=="undefined"){       // bản tĩnh xuất ra để backup
    st=migrate(window.__DATA__.data||window.__DATA__);
    rev=window.__DATA__.rev||0; updatedAt=window.__DATA__.updatedAt||null;
    online=false; fromCache=false; render(); return;
  }
  try{
    const r=await fetch("api/data",{cache:"no-store"});
    if(!r.ok){
      const j=await r.json().catch(()=>({}));
      throw new Error("HTTP "+r.status+(j.error?" — "+j.error:""));
    }
    const j=await r.json();
    /* Có thay đổi chưa lưu từ lần trước (mạng hỏng / server lỗi) mà bản trên web lại khác:
       không được im lặng đè lên — đưa cho người dùng chọn. */
    if(unsaved&&isAdmin&&JSON.stringify(j.data)!==JSON.stringify(st)){
      online=true; loadErr=""; fromCache=false; dirty=true; render();
      return conflictDialog({rev:j.rev||0,updatedAt:j.updatedAt||null,data:j.data});
    }
    st=migrate(j.data); rev=j.rev||0; updatedAt=j.updatedAt||null;
    online=true; loadErr=""; fromCache=false; dirty=false; writeCache();
  }
  catch(e){ online=false; loadErr=e.message||String(e);
    if(!st){ st=migrate({v:3,sessions:[],members:[],flags:{},qr:"",note:""}); } }
  render();
}

/* Lưu: gộp các thay đổi liên tiếp rồi đẩy lên.
   Đang gửi dở mà có thay đổi mới thì XẾP HÀNG, tuyệt đối không vứt.
   (Bỏ rơi một lần lưu chính là thứ đẻ ra "conflict" bí ẩn ở lần mở sau:
    cache còn dirty, server thì đã khác, mà không ai biết khác chỗ nào.) */
const SAVE_DELAY=1200, RETRY_DELAY=4000, MAX_RETRY=3;
let dirty=false, saving=false, saveErr="", savedAt=null, saveTimer=null, retries=0, localSeq=0;
function touch(){ dirty=true; localSeq++; writeCache(); renderSaveBar(); schedulePush(); }
/* Nhật ký sửa đổi. Nằm trong chính cục dữ liệu nên không tốn thêm lần đọc/ghi nào.
   Thao tác giống hệt lặp lại trong 1 phút thì gộp (vd gõ số tài khoản từng ký tự). */
function logAdd(msg){
  if(!Array.isArray(st.log)) st.log=[];
  const last=st.log[st.log.length-1];
  if(last&&last.m===msg&&Date.now()-new Date(last.t).getTime()<60000) last.t=new Date().toISOString();
  else st.log.push({t:new Date().toISOString(),m:msg});
  if(st.log.length>LOG_MAX) st.log=st.log.slice(-LOG_MAX);
}
const act=msg=>{ logAdd(msg); touch(); };   // ghi nhật ký rồi lưu
function schedulePush(ms){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>push(),ms||SAVE_DELAY); }
async function push(forceRev){
  if(!isAdmin) return;
  if(saving) return;                          // đang gửi; xong sẽ tự kiểm lại localSeq
  clearTimeout(saveTimer);
  saving=true; saveErr=""; renderSaveBar();
  /* Thân request được đóng gói NGAY LÚC NÀY. Thay đổi xảy ra sau đây mà trước khi
     phản hồi về thì KHÔNG nằm trong gói — nên chỉ được xóa cờ dirty nếu localSeq
     không nhúc nhích. Thiếu chốt này là mất thay đổi mà không ai hay. */
  const seq=localSeq;
  let conflict=null;
  try{
    const r=await fetch("api/data",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({pass,rev:forceRev===undefined?rev:forceRev,data:st})});
    const j=await r.json().catch(()=>({}));
    if(r.status===409) conflict=j.server||null;
    else if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
    else { rev=j.rev; updatedAt=j.updatedAt; savedAt=Date.now(); online=true; retries=0;
           if(localSeq===seq) dirty=false;     // không có gì xen vào → coi như sạch
           writeCache(); }
  }catch(e){ saveErr=e.message||String(e); }
  saving=false; renderSaveBar(); renderStamp();
  if(conflict) return conflictDialog(conflict);
  if(saveErr){ if(retries<MAX_RETRY){ retries++; schedulePush(RETRY_DELAY); } return; }
  if(dirty) schedulePush(200);                // còn thay đổi chưa gửi → gửi tiếp ngay
}
/* Liệt kê đúng những chỗ hai bản khác nhau — để không phải đoán khi gặp conflict. */
function diffSummary(mine,theirs){
  const out=[];
  const nm=(d,mid)=>{ const m=(d.members||[]).find(x=>x.id===mid); return m?m.name:"(ai đó)"; };
  const map=d=>new Map((d.sessions||[]).map(s=>[s.id,s]));
  const A=map(mine), B=map(theirs);
  A.forEach((s,k)=>{ if(!B.has(k)) out.push(`Buổi <b>${esc(s.date||"?")}</b>: chỉ có ở máy này`); });
  B.forEach((s,k)=>{ if(!A.has(k)) out.push(`Buổi <b>${esc(s.date||"?")}</b>: chỉ có trên web`); });
  A.forEach((a,k)=>{
    const b=B.get(k); if(!b) return;
    const d=esc(a.date||"?");
    if(a.court!==b.court||a.shuttles!==b.shuttles||a.price!==b.price||a.date!==b.date)
      out.push(`Buổi <b>${d}</b>: tiền hoặc ngày khác nhau`);
    if((a.parts||[]).length!==(b.parts||[]).length)
      out.push(`Buổi <b>${d}</b>: số người khác (${a.parts.length} ở máy này / ${b.parts.length} trên web)`);
    Object.keys(a.paid||{}).forEach(mid=>{ if(!(b.paid||{})[mid])
      out.push(`Buổi <b>${d}</b> · ${esc(nm(mine,mid))}: <b>máy này</b> ghi đã trả, web chưa`); });
    Object.keys(b.paid||{}).forEach(mid=>{ if(!(a.paid||{})[mid])
      out.push(`Buổi <b>${d}</b> · ${esc(nm(theirs,mid))}: <b>web</b> ghi đã trả, máy này chưa`); });
    if((a.photo||"")!==(b.photo||"")) out.push(`Buổi <b>${d}</b>: ảnh buổi chơi khác nhau`);
  });
  const mA=new Map((mine.members||[]).map(m=>[m.id,m])), mB=new Map((theirs.members||[]).map(m=>[m.id,m]));
  mA.forEach((m,k)=>{ if(!mB.has(k)) out.push(`Người <b>${esc(m.name)}</b>: chỉ có ở máy này`); });
  mB.forEach((m,k)=>{ if(!mA.has(k)) out.push(`Người <b>${esc(m.name)}</b>: chỉ có trên web`); });
  mA.forEach((m,k)=>{ const o=mB.get(k); if(!o) return;
    if(m.name!==o.name) out.push(`Tên khác: "<b>${esc(m.name)}</b>" ở máy này / "<b>${esc(o.name)}</b>" trên web`);
    if((m.av||"")!==(o.av||"")) out.push(`Ảnh đại diện của <b>${esc(m.name)}</b> khác nhau`); });
  if((mine.note||"")!==(theirs.note||"")) out.push("Thông tin ngân hàng khác nhau");
  if((mine.qr||"")!==(theirs.qr||"")) out.push("Mã QR khác nhau");
  return out;
}
function conflictDialog(server){
  const lines=server&&server.data?diffSummary(st,server.data):[];
  const show=lines.slice(0,10);
  const when=server&&server.updatedAt?new Date(server.updatedAt).toLocaleString("vi-VN"):"?";
  overlay(`<div class="sheet">
    <b style="font-size:16px">Sổ đã bị sửa ở nơi khác</b>
    <p class="small muted">Trên web đang là phiên bản <b>${server?server.rev:"?"}</b> (lúc ${esc(when)}), máy này giữ phiên bản <b>${rev}</b>. Thường là do bạn mở app ở tab/máy khác.</p>
    ${show.length?`<div class="card" style="margin:0 0 10px;background:var(--paper)">
      <div class="tiny muted b" style="letter-spacing:.5px;margin-bottom:6px">KHÁC NHAU Ở ${lines.length} CHỖ</div>
      <div class="small" style="line-height:1.9">${show.map(l=>"• "+l).join("<br>")}
      ${lines.length>show.length?`<div class="tiny muted" style="margin-top:6px">…và ${lines.length-show.length} chỗ nữa</div>`:""}</div></div>`
      :`<div class="card small muted" style="margin:0 0 10px;background:var(--paper)">Nội dung hai bản giống nhau — chỉ lệch số phiên bản. Chọn cách nào cũng không mất gì.</div>`}
    <button class="primary" id="cf-take" style="margin-bottom:8px">Lấy bản trên web (bỏ thay đổi đang sửa)</button>
    <button class="ghost" id="cf-force" style="width:100%">Ghi đè bằng bản của tôi</button>
    <div class="tiny muted" style="margin-top:8px">Ghi đè sẽ xóa thay đổi mà bản kia vừa lưu. Chỉ chọn khi chắc chắn.</div>
  </div>`);
  document.getElementById("cf-take").onclick=()=>{
    if(server){ st=migrate(server.data); rev=server.rev; updatedAt=server.updatedAt; dirty=false; writeCache(); }
    overlay(""); render();
  };
  document.getElementById("cf-force").onclick=()=>{ overlay(""); push(server?server.rev:rev); };
}
window.addEventListener("beforeunload",e=>{ if(isAdmin&&dirty){ e.preventDefault(); e.returnValue=""; } });

/* ══════════════════════════════════════════════════════════════════
   3. KHUNG — tab, thanh trạng thái, toast, modal
   ══════════════════════════════════════════════════════════════════ */
const qs=new URLSearchParams(location.search);
let me=qs.get("me")||localStorage.getItem(ME_KEY)||null;
let view="me", adminTab="sessions";

function overlay(html){
  const el=document.getElementById("overlay");
  if(!html){ el.innerHTML=""; return; }
  el.innerHTML=`<div class="modal" id="mm">${html}</div>`;
  document.getElementById("mm").onclick=e=>{ if(e.target.id==="mm") el.innerHTML=""; };
}
let toastTimer=null;
function toast(msg,undo){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  clearTimeout(toastTimer);
  const el=document.createElement("div"); el.className="toast";
  el.innerHTML=`<span style="flex:1">${esc(msg)}</span>`;
  if(undo){ const b=document.createElement("button"); b.textContent="Hoàn tác";
    b.onclick=()=>{ undo(); el.remove(); clearTimeout(toastTimer); }; el.appendChild(b); }
  document.body.appendChild(el);
  toastTimer=setTimeout(()=>el.remove(),undo?7000:2600);
}
function collect(pairs,label){
  const before=pairs.map(p=>({s:p.s,mid:p.mid,prev:p.s.paid?p.s.paid[p.mid]:undefined}));
  pairs.forEach(p=>setPaid(p.s,p.mid,true));
  act(label||"Ghi nhận đã trả");
  return ()=>{ before.forEach(b=>{ if(b.prev===undefined) delete b.s.paid[b.mid]; else b.s.paid[b.mid]=b.prev; });
    act("Hoàn tác: "+(label||"ghi nhận đã trả")); render(); toast("Đã hoàn tác."); };
}
function renderStamp(){
  const el=document.getElementById("stamp");
  if(!updatedAt&&!loadErr){ el.className="stamp"; el.innerHTML=`<b>Sổ trống</b>`; return; }
  const t=updatedAt?new Date(updatedAt):null;
  const when=t?t.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"})+" "+t.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"}):"—";
  el.className="stamp"+((!online||fromCache)?" warn":"");
  el.innerHTML=`cập nhật<br><b>${esc(when)}</b>`;
}
function renderSaveBar(){
  document.querySelectorAll(".savebar").forEach(x=>x.remove());
  if(!isAdmin) return;
  let cls="",dot="",txt="";
  if(saveErr){ cls=" err"; dot=" bad";
    txt="Lưu lỗi: "+saveErr+(retries&&retries<MAX_RETRY?` (đang thử lại lần ${retries}…)`:""); }
  else if(saving){ dot=" wait"; txt="Đang lưu lên web…"; }
  else if(dirty){ dot=" wait"; txt="Có thay đổi chưa lưu"; }
  else txt="Đã lưu"+(savedAt?" lúc "+new Date(savedAt).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"}):"")+" · phiên bản "+rev;
  const el=document.createElement("div"); el.className="savebar"+cls;
  el.innerHTML=`<span class="dot${dot}"></span><span style="flex:1">${esc(txt)}</span>`;
  if(dirty||saveErr){ const b=document.createElement("button"); b.textContent="Lưu ngay"; b.onclick=()=>push(); el.appendChild(b); }
  document.body.appendChild(el);
}
function renderTabs(){
  const el=document.getElementById("tabs");
  const defs=isAdmin
    ? [["sessions","Buổi chơi"],["members","Thành viên"],["collect","Thu tiền"],["view","Xem thử"]]
    : [["me","Của tôi"],["all","Cả nhóm"],["sessions","Các buổi"]];
  el.innerHTML=defs.map(([k,label])=>{
    const on=isAdmin?(adminTab===k):(view===k);
    return `<button class="tab ${on?"active":""}" data-t="${k}">${label}</button>`;
  }).join("");
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    if(isAdmin){ if(b.dataset.t==="view"){ isAdmin=false; view="all"; } else adminTab=b.dataset.t; }
    else view=b.dataset.t;
    render(); window.scrollTo({top:0});
  });
}
function render(){
  renderTabs(); renderStamp(); renderSaveBar(); renderPicBar();
  const app=document.getElementById("app");
  let banner="";
  if(loadErr&&!online){
    /* Phân biệt "mạng của bạn hỏng" với "máy chủ trả lỗi" — hai thứ này chữa khác nhau hẳn. */
    const srvErr=/^HTTP [45]/.test(loadErr);
    banner=`<div class="banner ${srvErr?"err":"off"}">⚠ ${srvErr
      ?`Máy chủ báo lỗi — <span class="num">${esc(loadErr.replace(/\.+$/,""))}</span>`
      :"Không kết nối được máy chủ (mất mạng?)"}${
      fromCache?". Đang xem số liệu đã lưu trong máy.":"."}</div>`;
  }
  else if(fromCache) banner=`<div class="banner off">Đang tải số mới nhất…</div>`;
  app.innerHTML=banner+`<div id="body"></div>`;
  const body=document.getElementById("body");
  if(isAdmin){
    if(adminTab==="sessions") adminSessions(body);
    else if(adminTab==="members") adminMembers(body);
    else adminCollect(body);
  } else {
    if(view==="me") viewMe(body);
    else if(view==="all") viewAll(body);
    else viewSessions(body);
  }
  renderFoot();
}
function renderFoot(){
  const f=document.getElementById("foot");
  f.innerHTML=isAdmin
    ? `<button class="link" id="f-exit">Thoát quản trị</button>`
    : `<button class="link muted" id="f-admin" style="color:var(--soft)">Quản trị</button>`;
  const a=document.getElementById("f-admin");
  if(a) a.onclick=loginDialog;
  const x=document.getElementById("f-exit");
  if(x) x.onclick=()=>{
    if(dirty&&!confirm("Còn thay đổi chưa lưu. Thoát luôn?")) return;
    isAdmin=false; pass=""; try{localStorage.removeItem(PASS_KEY);}catch(e){}
    view="all"; render();
  };
}
function loginDialog(){
  overlay(`<div class="sheet">
    <b style="font-size:16px">Đăng nhập quản trị</b>
    <p class="small muted">Chỉ người giữ sổ mới cần. Người xem cứ đóng hộp này lại.</p>
    <input type="password" id="pw" placeholder="Mật khẩu" autocomplete="current-password">
    <div class="small" id="pw-err" style="color:var(--danger);margin-top:6px"></div>
    <button class="primary" id="pw-go" style="margin-top:10px">Mở khóa</button>
  </div>`);
  const inp=document.getElementById("pw"); inp.focus();
  const go=async()=>{
    const err=document.getElementById("pw-err"); err.textContent="";
    try{
      const r=await fetch("api/data",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({pass:inp.value,check:1})});
      if(!r.ok){ err.textContent=(await r.json().catch(()=>({}))).error||"Sai mật khẩu."; return; }
      pass=inp.value; isAdmin=true;
      try{ localStorage.setItem(PASS_KEY,pass); }catch(e){}
      overlay(""); adminTab="sessions";
      try{ await fetchData(); }catch(e){}       // lấy bản mới nhất trước khi sửa
      render();
    }catch(e){ err.textContent="Không gọi được máy chủ: "+e.message; }
  };
  document.getElementById("pw-go").onclick=go;
  inp.onkeydown=e=>{ if(e.key==="Enter") go(); };
}

/* ══════════════════════════════════════════════════════════════════
   4. TRANG XEM
   ══════════════════════════════════════════════════════════════════ */
let pickQ="", allQ="", allFilter="due";

function viewMe(root){
  const m=me?memById(me):null;
  if(!m){ return pickerScreen(root); }
  const due=memberDue(m.id), paidSum=memberPaidSum(m.id);
  const dueSes=memberDueSessions(m.id), paidSes=memberSessions(m.id).filter(s=>isPaid(s,m.id));

  let html=`<div class="hero">
    ${avatarHTML(m,72)}
    <div class="b" style="font-size:18px;margin-top:8px">${esc(fullName(m))}</div>
    ${due>EPS
      ? `<div class="tiny muted b" style="letter-spacing:.6px;margin-top:10px">CẦN CHUYỂN</div>
         <div class="huge due">${fmt(due)}</div>
         <div class="sub num">${vnd(due)} · ${dueSes.length} buổi</div>`
      : `<div class="huge ok" style="font-size:34px;margin-top:10px">Không nợ gì 🎉</div>
         <div class="sub">${paidSum>EPS?`Đã trả đủ ${fmt(paidSum)}`:"Chưa tham gia buổi nào"}</div>`}
  </div>`;

  if(due>EPS){
    html+=`<div class="card">
      <div class="tiny muted b" style="letter-spacing:.5px">NỘI DUNG CHUYỂN KHOẢN</div>
      <div class="copyrow"><code id="ref">${esc(payRef(m))}</code>
        <button class="ghost mini" id="ref-copy">Chép</button></div>
      ${st.note?`<div class="small b" style="margin-top:10px;text-align:center">${esc(st.note)}</div>`:""}
      ${st.qr?`<div style="text-align:center"><img class="qrimg" src="${esc(st.qr)}" alt="QR"></div>`:""}
      <div class="tiny muted" style="text-align:center;margin-top:8px">Ghi đúng nội dung giúp mình đối soát nhanh nha</div>
    </div>`;
  }

  html+=`<h2 class="sec">${due>EPS?`Các buổi chưa trả · ${dueSes.length}`:"Các buổi"}</h2>`;
  html+=dueSes.map(s=>`<div class="card">
      <div class="row" style="align-items:flex-start;gap:10px">${sessionPhoto(s,42)}
        <div style="flex:1;min-width:0">
      <div class="between"><b>${esc(s.date||"—")}</b><b class="num due">${fmt(shareIn(s,m.id))}</b></div>
      <div class="small muted num" style="margin-top:2px">(${s.court} + ${s.shuttles}×${s.price||DEFAULT_PRICE}) / ${numStr(sWeight(s))} suất = ${fmt(sPerUnit(s))}/suất${
        (s.parts.find(p=>p.mid===m.id)||{}).weight!==1?` × ${numStr((s.parts.find(p=>p.mid===m.id)||{}).weight)} suất của bạn`:""}</div>
        </div></div>

function copy(text,msg){
  const done=()=>toast(msg||"Đã chép");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea"); ta.value=text;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast("Không chép được, bạn copy tay nhé"); }
    ta.remove();
  }
}

/* ══════════════════════════════════════════════════════════════════
   5. XUẤT ẢNH — vẽ thẳng lên canvas, không dùng thư viện ngoài
   ══════════════════════════════════════════════════════════════════ */
const IMG_W=1080, S=2;
const C={paper:"#F6F7F4",card:"#FFFFFF",ink:"#17211D",soft:"#5A655E",line:"#E2E6DF",
  court:"#256E4E",tint:"#E8F0EB",amber:"#B7601F",amberT:"#F7ECE1"};
const F=(w,s)=>`${w} ${s}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif`;
const FM=(w,s)=>`${w} ${s}px ui-monospace,Menlo,Consolas,monospace`;

function loadImg(src){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }
function rrect(x,rx,ry,w,h,r){ x.beginPath();
  if(x.roundRect) x.roundRect(rx,ry,w,h,r);
  else { x.moveTo(rx+r,ry); x.arcTo(rx+w,ry,rx+w,ry+h,r); x.arcTo(rx+w,ry+h,rx,ry+h,r);
         x.arcTo(rx,ry+h,rx,ry,r); x.arcTo(rx,ry,rx+w,ry,r); x.closePath(); }
}
function clipText(x,str,maxW){
  if(x.measureText(str).width<=maxW) return str;
  let s=str; while(s.length>1&&x.measureText(s+"…").width>maxW) s=s.slice(0,-1);
  return s+"…";
}
function drawAvatar(x,img,m,ax,ay,d){
  x.save(); x.beginPath(); x.arc(ax+d/2,ay+d/2,d/2,0,Math.PI*2); x.clip();
  if(img) x.drawImage(img,ax,ay,d,d);
  else { x.fillStyle=hue(m.id); x.fillRect(ax,ay,d,d);
    x.fillStyle="#fff"; x.font=F(700,Math.round(d*.36)); x.textAlign="center"; x.textBaseline="middle";
    x.fillText(initials(m.name),ax+d/2,ay+d/2+1); }
  x.restore(); x.textAlign="left"; x.textBaseline="alphabetic";
}
function mkCanvas(h){
  const c=document.createElement("canvas");
  c.width=IMG_W*S; c.height=Math.round(h)*S;
  const x=c.getContext("2d"); x.scale(S,S);
  x.fillStyle=C.paper; x.fillRect(0,0,IMG_W,h);
  return {c,x};
}
/* Cấp dư chiều cao rồi cắt đúng phần đã vẽ — khỏi phải tính chiều cao bằng tay,
   thêm bớt dòng sau này cũng không lo dư/thiếu khoảng trắng. */
function cropTo(c,h){
  const out=document.createElement("canvas");
  out.width=c.width; out.height=Math.round(h)*S;
  out.getContext("2d").drawImage(c,0,0);
  return out;
}
function stampLine(x,y){
  x.fillStyle=C.soft; x.font=F(400,22); x.textAlign="center";
  const t=updatedAt?new Date(updatedAt).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
  x.fillText("Số liệu cập nhật lúc "+t+" · nếu bạn vừa chuyển thì đợi ghi nhận nhé",IMG_W/2,y);
  x.textAlign="left";
}

async function exportPersonImage(m){
  const dueSes=memberDueSessions(m.id), due=memberDue(m.id), paidSum=memberPaidSum(m.id);
  const P=56, hasQR=!!st.qr&&due>EPS;
  const {c,x}=mkCanvas(760+dueSes.length*110+(st.note?60:0)+(hasQR?360:0));
  const [av,qr]=await Promise.all([m.av?loadImg(m.av):null, hasQR?loadImg(st.qr):null]);
  let y=P;

  drawAvatar(x,av,m,P,y,110);
  x.fillStyle=C.ink; x.font=F(700,44);
  x.fillText(clipText(x,fullName(m),IMG_W-P*2-140),P+140,y+52);
  x.fillStyle=C.soft; x.font=F(400,26);
  x.fillText(memberSessions(m.id).length+" buổi đã chơi",P+140,y+92);
  y+=150;

  x.fillStyle=C.line; x.fillRect(P,y,IMG_W-P*2,2); y+=30;

  rrect(x,P,y,IMG_W-P*2,150,20);
  x.fillStyle=due>EPS?C.amberT:C.tint; x.fill();
  x.textAlign="center";
  x.fillStyle=C.soft; x.font=F(700,24); x.fillText(due>EPS?"CẦN CHUYỂN":"TÌNH TRẠNG",IMG_W/2,y+44);
  x.fillStyle=due>EPS?C.amber:C.court; x.font=FM(800,due>EPS?76:52);
  x.fillText(due>EPS?fmt(due):"Đã trả đủ ✓",IMG_W/2,y+112);
  if(due>EPS){ x.fillStyle=C.soft; x.font=FM(400,24); x.fillText(vnd(due),IMG_W/2,y+142); }
  x.textAlign="left"; y+=170+34;

  if(dueSes.length){
    x.fillStyle=C.soft; x.font=F(700,24); x.fillText("CÁC BUỔI CHƯA TRẢ",P,y); y+=46;
    dueSes.forEach(s=>{
      rrect(x,P,y,IMG_W-P*2,88,14); x.fillStyle=C.card; x.fill();
      x.strokeStyle=C.line; x.lineWidth=1.5; x.stroke();
      x.fillStyle=C.ink; x.font=F(700,30); x.fillText(s.date||"—",P+22,y+38);
      x.fillStyle=C.soft; x.font=FM(400,22);
      const w=(s.parts.find(p=>p.mid===m.id)||{}).weight;
      x.fillText(clipText(x,`(${s.court} + ${s.shuttles}×${s.price||DEFAULT_PRICE}) / ${numStr(sWeight(s))} suất = ${fmt(sPerUnit(s))}/suất`+(w!==1?` × ${numStr(w)}`:""),IMG_W-P*2-260),P+22,y+70);
      x.textAlign="right"; x.fillStyle=C.amber; x.font=FM(700,34);
      x.fillText(fmt(shareIn(s,m.id)),IMG_W-P-22,y+54); x.textAlign="left";
      y+=104;
    });
  } else { x.fillStyle=C.soft; x.font=F(400,28); x.textAlign="center";
    x.fillText("Không còn buổi nào đang nợ 🎉",IMG_W/2,y+40); x.textAlign="left"; y+=70; }

  if(paidSum>EPS){ x.fillStyle=C.court; x.font=F(600,24);
    x.fillText("✓ Đã trả trước đó "+fmt(paidSum)+" ("+memberSessions(m.id).filter(s=>isPaid(s,m.id)).length+" buổi)",P,y+34); y+=60; }

  if(due>EPS){
    y+=24;
    x.fillStyle=C.soft; x.font=F(700,24); x.textAlign="center";
    x.fillText("NỘI DUNG CHUYỂN KHOẢN",IMG_W/2,y);
    x.fillStyle=C.ink; x.font=FM(700,30); x.fillText(payRef(m),IMG_W/2,y+40); y+=64;
    if(st.note){ x.fillStyle=C.ink; x.font=F(600,28); x.fillText(clipText(x,st.note,IMG_W-P*2),IMG_W/2,y+30); y+=44; }
    if(qr){ const d=300; x.drawImage(qr,(IMG_W-d)/2,y+10,d,d); y+=330; }
    x.textAlign="left";
  } else y+=40;

  stampLine(x,y+34);
  showImage(cropTo(c,y+58),"caulong-"+norm(m.name).replace(/\s+/g,"-")+".png");
}

function showImage(canvas,filename){
  const url=canvas.toDataURL("image/png");
  overlay(`<div class="sheet">
    <div class="between" style="margin-bottom:10px"><b>Ảnh đã tạo xong</b>
      <button class="link" id="im-x">Đóng</button></div>
    <img src="${url}" alt="">
    <button class="primary" id="im-dl" style="margin-top:12px">Tải về máy</button>
    <div class="tiny muted" style="text-align:center;margin-top:8px">Trên điện thoại: nhấn giữ vào ảnh rồi chọn “Lưu ảnh”.</div>
  </div>`);
  document.getElementById("im-x").onclick=()=>overlay("");
  document.getElementById("im-dl").onclick=()=>{
    canvas.toBlob(b=>{
      const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    },"image/png");
  };
}

    <button class="fp ${sessFilter==="done"?"on":""}" data-f="done">Đã xong · ${st.sessions.length-openN}</button>
    <button class="fp ${sessFilter==="all"?"on":""}" data-f="all">Tất cả · ${st.sessions.length}</button>
  </div>`;
  const list=orderedSessions().filter(s=>sessFilter==="all"||(sessFilter==="open"?!sSettled(s):sSettled(s)));
  if(!list.length) html+=`<div class="card"><div class="empty">${st.sessions.length===0?"Chưa có buổi nào.":"Không có buổi nào ở mục này."}</div></div>`;
  list.forEach(s=>{
    const settled=sSettled(s), d=sDue(s), got2=sCollected(s), tot=sTotal(s);
    html+=`<div class="card ${settled?"done":""}">
      <div class="row" style="align-items:flex-start;gap:10px">
        ${sessionPhoto(s,46)}
        <div style="flex:1;min-width:0"><div class="between">
          <div><b>${esc(s.date||"(chưa đặt ngày)")}</b>
            <span class="muted small"> · ${s.parts.length} người</span></div>
          <div class="num b">${fmt(tot)}</div></div></div>
      </div>
      <div class="small muted num" style="margin-top:3px">(${s.court} + ${s.shuttles}×${s.price||DEFAULT_PRICE}) / ${numStr(sWeight(s))} suất = ${fmt(sPerUnit(s))}/suất</div>
      <div class="bar"><i style="width:${tot>EPS?Math.round(got2/tot*100):0}%"></i></div>
      <div class="small">${settled?`<span class="ok b">✓ Đã thu đủ</span>`
        :`Đã thu <b class="num">${fmt(got2)}</b> / ${fmt(tot)} · còn <b class="due">${sUnpaid(s).length} người · ${fmt(d)}</b>`}</div>
      <div class="chips">${s.parts.map(p=>{
        const m=memById(p.mid); if(!m)return "";
        const on=isPaid(s,p.mid), w=whenLabel(s.paid&&s.paid[p.mid]);
        return `<button class="chip ${on?"on":""}" data-pay-s="${esc(s.id)}" data-pay-m="${esc(p.mid)}"
          title="${on?`Đã trả${w?" "+w:""} — bấm để bỏ dấu`:`Chưa trả ${fmt(shareIn(s,p.mid))}`}">
          ${avatarHTML(m,20)}${on?'<span class="tick">✓</span>':""}<span class="nm2">${esc(fullName(m))}</span>${
          p.weight!==1?`<span class="pill">×${numStr(p.weight)}</span>`:""}</button>`;
      }).join("")}</div>
      <div class="row" style="margin-top:11px;gap:8px;flex-wrap:wrap">
        ${settled?`<button class="ghost mini" data-reopen="${esc(s.id)}">Bỏ dấu tất cả</button>`
                 :`<button class="ghost mini" data-payall="${esc(s.id)}">Thu hết ${fmt(d)}</button>`}
        <div style="flex:1"></div>
        <button class="link" data-edit="${esc(s.id)}">Sửa</button>
        <button class="link del" data-delsession="${esc(s.id)}">Xóa</button>
      </div></div>`;
  });
  root.innerHTML=html;
  const S_=i=>st.sessions.find(x=>x.id===i);
  document.getElementById("add-session").onclick=()=>openForm(null);
  root.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ sessFilter=b.dataset.f; render(); });
  root.querySelectorAll("[data-pay-s]").forEach(b=>b.onclick=()=>{
    const s=S_(b.dataset.payS), mid=b.dataset.payM; if(!s)return;
    const on=isPaid(s,mid), who=memById(mid)?.name||"?", tien=fmt(shareIn(s,mid));
    setPaid(s,mid,!on);
    act(`${on?"Bỏ dấu đã trả":"Đánh dấu đã trả"}: ${who} · buổi ${s.date||"?"} · ${tien}`);
    render();
    if(!on) toast(`${who} đã trả ${tien} · buổi ${s.date||"?"}`);
  });
  root.querySelectorAll("[data-payall]").forEach(b=>b.onclick=()=>{
    const s=S_(b.dataset.payall); if(!s)return;
    const mids=sUnpaid(s); if(!mids.length)return;
    const amt=sDue(s);
    const undo=collect(mids.map(mid=>({s,mid})),`Thu hết buổi ${s.date||"?"}: ${mids.length} người · ${fmt(amt)}`);
    render(); toast(`Đã thu ${fmt(amt)} từ ${mids.length} người · buổi ${s.date||"?"}`,undo);
  });
  root.querySelectorAll("[data-reopen]").forEach(b=>b.onclick=()=>{
    const s=S_(b.dataset.reopen); if(!s)return;
    if(!confirm(`Bỏ dấu "đã trả" của cả ${s.parts.length} người trong buổi ${s.date||"?"}?`))return;
    s.paid={}; act(`Bỏ dấu đã trả cả buổi ${s.date||"?"} (${s.parts.length} người)`); render();
  });
  root.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openForm(b.dataset.edit));
  root.querySelectorAll("[data-delsession]").forEach(b=>b.onclick=()=>{
    const s=S_(b.dataset.delsession); if(!s)return;
    if(!confirm(`Xóa buổi ${s.date||"?"}?\n\nLịch sử đã thu ${fmt(sCollected(s))} của buổi này cũng mất.\nChỉ muốn dọn màn hình thì dùng bộ lọc "Đã xong".`))return;
    st.sessions=st.sessions.filter(x=>x.id!==s.id);
    act(`Xóa buổi ${s.date||"?"} · ${fmt(sTotal(s))}`); render();
  });
  bindPics(root);
  if(editingId!==null) renderForm();
}

function openForm(sid){
  editingId=sid;
  draft=sid?JSON.parse(JSON.stringify(st.sessions.find(x=>x.id===sid)))
           :{id:id(),date:"",court:0,price:DEFAULT_PRICE,shuttles:0,parts:[],paid:{}};
  renderForm();
  document.getElementById("session-form").scrollIntoView({behavior:"smooth",block:"start"});
}
function renderForm(){
  const box=document.getElementById("session-form"); if(!box||!draft)return;
  const chosen=new Map(draft.parts.map(p=>[p.mid,p.weight]));
  const editing=st.sessions.some(s=>s.id===editingId);
  const ppl=st.members.map(m=>{
    const on=chosen.has(m.id), wt=on?chosen.get(m.id):1;
    return `<div class="pp">
      <div class="chk ${on?"on":""}" data-toggle="${esc(m.id)}">${on?"✓":""}</div>
      <button class="avbtn ${picOn("m",m.id)?"arm":""}" data-pic="m" data-picid="${esc(m.id)}">${avatarHTML(m,28)}</button>
      <div class="nm trunc">${esc(m.name)}${esc(dupTag(m))}${isPaid(draft,m.id)?` <span class="pill green">đã trả</span>`:""}</div>
      ${on?`<button class="wbtn ${wt==1?"on":""}" data-w="1" data-m="${esc(m.id)}">1</button>
            <button class="wbtn ${wt==0.5?"on":""}" data-w="0.5" data-m="${esc(m.id)}">½</button>
            <input class="wnum" type="number" step="0.5" min="0" value="${wt}" data-wnum="${esc(m.id)}">`:""}
    </div>`;
  }).join("");
  box.innerHTML=`<div class="card" style="border-color:var(--court)">
    <div class="between"><b>${editing?"Sửa buổi":"Buổi mới"}</b><button class="link" id="form-close">Đóng</button></div>
    <div class="grid2" style="margin-top:10px">
      <div><label class="fld">Ngày</label><input type="text" id="f-date" placeholder="vd: 20/6" value="${esc(draft.date)}"></div>
      <div><label class="fld">Tiền sân</label><input type="number" id="f-court" value="${draft.court||""}" placeholder="200"></div>
    </div>
    <div class="grid2" style="margin-top:10px">
      <div><label class="fld">Số cầu</label><input type="number" id="f-shut" value="${draft.shuttles||""}" placeholder="3"></div>
      <div><label class="fld">Giá 1 cầu</label><input type="number" id="f-price" value="${draft.price}" placeholder="30"></div>
    </div>
    <label class="fld" style="margin-top:14px">Người chơi & hệ số</label>
    <div class="card" style="padding:4px 10px;margin:0">${ppl||'<div class="pp muted small">Chưa có thành viên nào.</div>'}</div>
    <div class="row" style="margin-top:8px;gap:8px">
      <input type="text" id="f-newmem" placeholder="Thêm người mới rồi Enter">
      <button class="ghost" id="f-addmem">Thêm</button>
    </div>
    <div class="card" style="margin:14px 0 0;background:var(--court-tint);border-color:var(--court-line)">
      <div class="small" id="f-tot"></div></div>
    <button class="primary" id="f-save" style="margin-top:10px">Lưu buổi</button>
  </div>`;
  formTotals();
  const sync=()=>{ draft.date=val("f-date"); draft.court=+numVal("f-court");
    draft.shuttles=+numVal("f-shut"); draft.price=+numVal("f-price")||DEFAULT_PRICE; };
  ["f-date","f-court","f-shut","f-price"].forEach(i=>{
    document.getElementById(i).oninput=()=>{ sync(); formTotals(); }; });
  document.getElementById("form-close").onclick=()=>{ editingId=null; draft=null; render(); };
  box.querySelectorAll("[data-toggle]").forEach(el=>el.onclick=()=>{
    sync(); const mid=el.dataset.toggle;
    if(chosen.has(mid)) draft.parts=draft.parts.filter(p=>p.mid!==mid);
    else draft.parts.push({mid,weight:1});
    renderForm();
  });
  box.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{
    sync(); const p=draft.parts.find(x=>x.mid===b.dataset.m); if(p)p.weight=+b.dataset.w; renderForm(); });
  box.querySelectorAll("[data-wnum]").forEach(i=>i.onchange=()=>{
    sync(); const p=draft.parts.find(x=>x.mid===i.dataset.wnum); if(p)p.weight=+i.value||0; renderForm(); });
  const addMem=()=>{
    sync(); const nm=val("f-newmem").trim(); if(!nm)return;
    const dup=st.members.filter(x=>x.name===nm).length;
    if(dup&&!confirm(`Đã có ${dup} người tên "${nm}".\nThêm người MỚI cùng tên? (phân biệt bằng ảnh)`))return;
    const m={id:id(),name:nm,av:""}; st.members.push(m); draft.parts.push({mid:m.id,weight:1});
    act(`Thêm thành viên: ${nm}`); renderForm();
    const el=document.getElementById("f-newmem"); if(el){ el.value=""; el.focus(); }
  };
  document.getElementById("f-addmem").onclick=addMem;
  document.getElementById("f-newmem").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); addMem(); } };
  document.getElementById("f-save").onclick=()=>{
    sync();
    if(!draft.parts.length){ alert("Chọn ít nhất 1 người chơi."); return; }
    Object.keys(draft.paid).forEach(k=>{ if(!draft.parts.some(p=>p.mid===k)) delete draft.paid[k]; });
    const i=st.sessions.findIndex(s=>s.id===draft.id);
    const moi=i<0;
    if(moi) st.sessions.push(draft); else st.sessions[i]=draft;
    act(`${moi?"Thêm":"Sửa"} buổi ${draft.date||"?"} · ${fmt(sTotal(draft))} · ${draft.parts.length} người`);
    editingId=null; draft=null; sessFilter="open"; render();
  };
  bindPics(box);
}
function formTotals(){
  const t=document.getElementById("f-tot"); if(!t||!draft)return;
  t.innerHTML=`Tổng ${fmt(sTotal(draft))} · ${numStr(sWeight(draft))} suất · <b class="num">${fmt(sPerUnit(draft))}</b>/suất`;
}

function adminMembers(root){
  const rows=st.members.map(m=>({m,due:memberDue(m.id),paid:memberPaidSum(m.id),
    n:memberSessions(m.id).length,nDue:memberDueSessions(m.id).length}))
    .sort((a,b)=>b.due-a.due||a.m.name.localeCompare(b.m.name,"vi"));
  const nDue=rows.filter(r=>r.due>EPS).length;
  let html=`<div class="hint">Bấm vào ảnh rồi <b>Ctrl+V</b> để dán ảnh nhận diện (hoặc kéo ảnh thả vào). Trùng tên vẫn dùng được.</div>
    <div class="row" style="gap:8px"><input type="text" id="m-new" placeholder="Tên thành viên mới">
      <button class="ghost" id="m-add">Thêm</button></div>
    <div class="filters">
      <button class="fp ${memFilter==="due"?"on":""}" data-mf="due">Còn nợ · ${nDue}</button>
      <button class="fp ${memFilter==="all"?"on":""}" data-mf="all">Tất cả · ${rows.length}</button>
    </div>`;
  const list=rows.filter(r=>memFilter==="all"||r.due>EPS);
  if(!list.length) html+=`<div class="card"><div class="empty">${rows.length?"Không ai còn nợ 🎉":"Chưa có thành viên nào."}</div></div>`;
  list.forEach(r=>{
    const m=r.m, open=openMember===m.id, clear=r.due<=EPS;
    let detail="";
    if(open){
      detail=`<div style="margin-top:8px">${memberSessions(m.id).slice().reverse().map(s=>{
        const on=isPaid(s,m.id), w=whenLabel(s.paid&&s.paid[m.id]);
        return `<div class="srow"><div class="sdate">${esc(s.date||"—")}</div>
          <div class="samt num ${on?"muted":"due b"}" style="${on?"text-decoration:line-through":""}">${fmt(shareIn(s,m.id))}</div>
          <button class="toggle ${on?"on":""}" data-mp-s="${esc(s.id)}" data-mp-m="${esc(m.id)}">${on?`✓ đã trả${w?" "+w:""}`:"chưa trả"}</button></div>`;
      }).join("")||`<div class="srow muted small">Chưa tham gia buổi nào.</div>`}</div>`;
    }
    html+=`<div class="card ${clear?"done":""}">
      <div class="row" style="align-items:flex-start">
        <button class="avbtn ${picOn("m",m.id)?"arm":""}" data-pic="m" data-picid="${esc(m.id)}">${avatarHTML(m,44)}</button>
        <div style="flex:1;min-width:0"><div class="between">
          <div style="min-width:0"><div class="b trunc">${esc(m.name)}${esc(dupTag(m))}</div>
            <div class="tiny muted">${clear?`${r.n} buổi · đã trả đủ`:`nợ ${r.nDue}/${r.n} buổi · đã trả ${fmt(r.paid)}`}</div></div>
          <div class="num b ${clear?"ok":"due"}" style="font-size:17px">${clear?"✓":fmt(r.due)}</div>
        </div></div>
      </div>
      ${st.flags[m.id]?`<div class="flag">⚠ ${esc(st.flags[m.id])}</div>`:""}
      ${detail}
      <div class="row" style="margin-top:9px;gap:8px;flex-wrap:wrap">
        <button class="ghost mini" data-open="${esc(m.id)}">${open?"Thu gọn ▴":"Chi tiết ▾"}</button>
        ${r.due>EPS?`<button class="ghost mini" data-payall-m="${esc(m.id)}">Thu ${fmt(r.due)}</button>`:""}
        <div style="flex:1"></div>
        <button class="link" data-note="${esc(m.id)}">Ghi chú</button>
        <button class="link" data-rename="${esc(m.id)}">Đổi tên</button>
        <button class="link del" data-delmem="${esc(m.id)}">Xóa</button>
      </div></div>`;
  });
  root.innerHTML=html;
  const add=()=>{
    const nm=val("m-new").trim(); if(!nm)return;
    const dup=st.members.filter(x=>x.name===nm).length;
    if(dup&&!confirm(`Đã có ${dup} người tên "${nm}".\nThêm người MỚI cùng tên?`))return;
    st.members.push({id:id(),name:nm,av:""}); memFilter="all";
    act(`Thêm thành viên: ${nm}`); render();
  };
  document.getElementById("m-add").onclick=add;
  document.getElementById("m-new").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } };
  root.querySelectorAll("[data-mf]").forEach(b=>b.onclick=()=>{ memFilter=b.dataset.mf; render(); });
  root.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    openMember=openMember===b.dataset.open?null:b.dataset.open; render(); });
  root.querySelectorAll("[data-mp-s]").forEach(b=>b.onclick=()=>{
    const s=st.sessions.find(x=>x.id===b.dataset.mpS), mid=b.dataset.mpM; if(!s)return;
    const on=isPaid(s,mid); setPaid(s,mid,!on);
    act(`${on?"Bỏ dấu đã trả":"Đánh dấu đã trả"}: ${memById(mid)?.name||"?"} · buổi ${s.date||"?"} · ${fmt(shareIn(s,mid))}`);
    render(); });
  root.querySelectorAll("[data-payall-m]").forEach(b=>b.onclick=()=>{
    const mid=b.dataset.payallM, ses=memberDueSessions(mid), amt=memberDue(mid);
    if(!ses.length)return;
    const undo=collect(ses.map(s=>({s,mid})),`Thu của ${memById(mid)?.name||"?"}: ${fmt(amt)} (${ses.length} buổi)`);
    render();
    toast(`${memById(mid)?.name||"?"} đã trả ${fmt(amt)} (${ses.length} buổi)`,undo); });
  root.querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>{
    const mid=b.dataset.note, cur=st.flags[mid]||"";
    const nw=prompt(`Ghi chú cho ${memById(mid)?.name||"?"} (để trống để xóa):`,cur); if(nw===null)return;
    if(nw.trim()) st.flags[mid]=nw.trim(); else delete st.flags[mid];
    act(`${nw.trim()?"Đặt":"Xóa"} ghi chú cho ${memById(mid)?.name||"?"}`); render(); });
  root.querySelectorAll("[data-rename]").forEach(b=>b.onclick=()=>{
    const m=memById(b.dataset.rename); if(!m)return;
    const nw=(prompt("Đổi tên:",m.name)||"").trim();
    if(!nw||nw===m.name)return;
    const cu=m.name; m.name=nw;
    act(`Đổi tên: "${cu}" → "${nw}"`); render(); });
  root.querySelectorAll("[data-delmem]").forEach(b=>b.onclick=()=>{
    const mid=b.dataset.delmem, m=memById(mid); if(!m)return;
    const used=memberSessions(mid).length, d=memberDue(mid);
    if(used>0&&!confirm(`${m.name} có mặt trong ${used} buổi${d>EPS?` và còn nợ ${fmt(d)}`:""}.\nXóa khỏi cả các buổi đó? Lịch sử sẽ mất.`))return;
    st.members=st.members.filter(x=>x.id!==mid);
    st.sessions.forEach(s=>{ s.parts=s.parts.filter(p=>p.mid!==mid); delete s.paid[mid]; });
    delete st.flags[mid]; sel.delete(mid);
    act(`Xóa thành viên ${m.name}${used>0?` (khỏi ${used} buổi)`:""}`);
    if(openMember===mid) openMember=null;
    if(picOn("m",mid)) picTarget=null;
    if(me===mid) me=null;
    render(); });
  bindPics(root);
}

  root.innerHTML=`<div class="hint">Tick người vừa chuyển khoản rồi bấm <b>Đã nhận tiền</b>. Sổ tự lưu lên web, cả nhóm thấy ngay.</div>

      <div class="tiny muted" style="margin-top:10px">Sổ đang ở phiên bản ${rev}. <button class="link" id="c-static" style="padding:0">Tải bản HTML tĩnh để backup</button></div>

            <div class="tiny muted num" style="width:86px;flex:0 0 auto;padding-top:1px">${
              ok?esc(d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})):"—"}</div>
            <div class="small" style="flex:1;min-width:0">${esc(e.m)}</div></div>`;
        }).join("")
        : `<div class="empty">Chưa ghi nhận thao tác nào. Từ giờ mọi thay đổi đều được ghi lại ở đây.</div>`}
      <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">
        ${(st.log||[]).length>logShow?`<button class="ghost mini" id="c-more">Xem thêm ${Math.min(30,st.log.length-logShow)}</button>`:""}
        ${logShow>15?`<button class="ghost mini" id="c-less">Thu gọn</button>`:""}
        <div style="flex:1"></div>
        ${(st.log||[]).length?`<button class="link del" id="c-logclear">Xóa lịch sử</button>`:""}
      </div>
      <div class="tiny muted" style="margin-top:8px">Giữ ${LOG_MAX} thao tác gần nhất. Nằm chung trong sổ nên không tốn thêm lần lưu nào.</div>
    </div>`;

  document.getElementById("c-all").onclick=()=>{ sel=new Set(owing.map(r=>r.m.id)); render(); };
  document.getElementById("c-none").onclick=()=>{ sel.clear(); render(); };
  root.querySelectorAll("[data-sel]").forEach(el=>el.onclick=()=>{
    const mid=el.dataset.sel; if(sel.has(mid))sel.delete(mid); else sel.add(mid); render(); });
  document.getElementById("c-go").onclick=()=>{
    if(!chosen.length)return;
    const names=chosen.map(r=>fullName(r.m));
    if(!confirm(`Ghi nhận đã thu ${fmt(grand)} từ ${names.length} người?\n\n${names.join(", ")}`))return;
    const pairs=[]; chosen.forEach(r=>memberDueSessions(r.m.id).forEach(s=>pairs.push({s,mid:r.m.id})));
    const undo=collect(pairs); sel.clear(); render();
    toast(`Đã ghi nhận ${fmt(grand)} từ ${names.length} người`,undo);
  };
  const noteEl=document.getElementById("c-note"); noteEl.value=st.note||"";
  noteEl.oninput=()=>{ st.note=noteEl.value; act("Sửa thông tin ngân hàng"); };
  document.getElementById("c-qr").onclick=()=>document.getElementById("qr-file").click();
  const qd=document.getElementById("c-qrdel");
  if(qd) qd.onclick=()=>{ st.qr=""; act("Xóa mã QR"); render(); };
  document.getElementById("c-import").onclick=()=>document.getElementById("json-file").click();
  document.getElementById("c-export").onclick=()=>{
    const b=new Blob([JSON.stringify(st,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="so-cau-long-"+new Date().toISOString().slice(0,10)+".json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  };
  document.getElementById("c-static").onclick=exportStatic;
  const more=document.getElementById("c-more");
  if(more) more.onclick=()=>{ logShow+=30; render(); };
  const less=document.getElementById("c-less");
  if(less) less.onclick=()=>{ logShow=15; render(); };
  const lc=document.getElementById("c-logclear");
  if(lc) lc.onclick=()=>{
    if(!confirm(`Xóa toàn bộ ${st.log.length} dòng lịch sử? Số liệu tiền nong không bị ảnh hưởng.`))return;
    st.log=[]; logShow=15; act("Xóa lịch sử chỉnh sửa"); render();
  };
}

/* ---- Ảnh: bấm vào ô ảnh → Ctrl+V, hoặc kéo thả, hoặc chọn file ----
   Dùng chung cho ảnh đại diện người (k:"m") và ảnh buổi chơi (k:"s"). ---- */
function shrink(blob,opt,cb){
  const rd=new FileReader();
  rd.onload=ev=>{ const im=new Image();
    im.onload=()=>{
      let w,h,sx=0,sy=0,sw=im.width,sh=im.height;
      if(opt.square){                        // avatar: cắt vuông ở giữa
        const side=Math.min(im.width,im.height);
        sx=(im.width-side)/2; sy=(im.height-side)/2; sw=sh=side;
        w=h=opt.size;
      } else {                               // ảnh buổi: giữ tỉ lệ, gói trong cạnh dài opt.size
        const r=Math.min(1,opt.size/Math.max(im.width,im.height));
        w=Math.max(1,Math.round(im.width*r)); h=Math.max(1,Math.round(im.height*r));
      }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,w,h);
      try{ cb(cv.toDataURL("image/jpeg",opt.q)); }catch(e){ cb(ev.target.result); }
    };
    im.onerror=()=>alert("Không đọc được ảnh này.");
    im.src=ev.target.result; };
  rd.readAsDataURL(blob);
}
function applyPic(t,blob){
  if(!t) return;
  if(t.k==="m") shrink(blob,{square:true,size:AV_SIZE,q:0.8},d=>{
    const m=memById(t.id); if(!m)return;
    m.av=d; act(`Đổi ảnh đại diện: ${m.name}`); render(); toast("Đã cập nhật ảnh cho "+m.name);
  });
  else shrink(blob,{square:false,size:PHOTO_SIZE,q:0.72},d=>{
    const s2=st.sessions.find(x=>x.id===t.id); if(!s2)return;
    s2.photo=d; act(`Thêm ảnh cho buổi ${s2.date||"?"}`); render(); toast("Đã thêm ảnh buổi "+(s2.date||""));
  });
}
const picName=t=>!t?"":(t.k==="m"?(memById(t.id)?.name||"")
  :("buổi "+(st.sessions.find(x=>x.id===t.id)?.date||"?")));
const picOn=(k,id)=>picTarget&&picTarget.k===k&&picTarget.id===id;
/* Ô ảnh của buổi chơi. Admin bấm để dán/đổi ảnh, người xem bấm để phóng to. */
function sessionPhoto(s,px){
  const z=px||46, box=`width:${z}px;height:${z}px;min-width:${z}px`;
  if(isAdmin) return `<button class="picbtn ${picOn("s",s.id)?"arm":""}" data-pic="s" data-picid="${esc(s.id)}"
      title="${s.photo?"Bấm rồi Ctrl+V để đổi ảnh buổi này":"Thêm ảnh buổi này cho dễ nhớ"}" style="${box}">${
      s.photo?`<img src="${esc(s.photo)}" alt="" style="${box}">`
             :`<span class="picph" style="${box}">+</span>`}</button>`;
  if(!s.photo) return "";
  return `<button class="picbtn" data-zoom="${esc(s.id)}" title="Xem ảnh" style="${box}"><img src="${esc(s.photo)}" alt="" style="${box}"></button>`;
}
/* Thanh này là cách DUY NHẤT đặt ảnh trên điện thoại — nơi không có Ctrl+V lẫn kéo thả. */
function renderPicBar(){
  const bar=document.getElementById("pic-bar");
  if(!isAdmin||!picTarget){ bar.innerHTML=""; return; }
  const co = picTarget.k==="m" ? !!memById(picTarget.id)?.av
                               : !!st.sessions.find(x=>x.id===picTarget.id)?.photo;
  bar.innerHTML=`<div class="picbar">
    <span style="flex:1;min-width:0">Ảnh cho <b>${esc(picName(picTarget))}</b> — <kbd>Ctrl</kbd>+<kbd>V</kbd> để dán</span>
    <button data-pb="file">Chọn ảnh</button>
    ${co?`<button data-pb="del">Xóa ảnh</button>`:""}
    <button data-pb="done">Xong</button></div>`;
  bar.querySelector('[data-pb="file"]').onclick=()=>document.getElementById("av-file").click();
  bar.querySelector('[data-pb="done"]').onclick=()=>{ picTarget=null; render(); };
  const d=bar.querySelector('[data-pb="del"]');
  if(d) d.onclick=()=>{
    if(picTarget.k==="m"){ const m=memById(picTarget.id); if(m){ m.av=""; act(`Xóa ảnh đại diện: ${m.name}`); } }
    else { const s2=st.sessions.find(x=>x.id===picTarget.id); if(s2){ s2.photo=""; act(`Xóa ảnh buổi ${s2.date||"?"}`); } }
    render();
  };
}
function bindPics(root){
  root.querySelectorAll("[data-zoom]").forEach(b=>b.onclick=()=>{
    const s2=st.sessions.find(x=>x.id===b.dataset.zoom);
    if(s2&&s2.photo) overlay(`<div class="sheet"><div class="between" style="margin-bottom:10px">
      <b>Buổi ${esc(s2.date||"?")}</b><button class="link" id="z-x">Đóng</button></div>
      <img src="${esc(s2.photo)}" alt=""></div>`);
    const x=document.getElementById("z-x"); if(x) x.onclick=()=>overlay("");
  });
  root.querySelectorAll("[data-pic]").forEach(b=>{
    const t={k:b.dataset.pic,id:b.dataset.picid};
    b.onclick=()=>{
      picTarget=picOn(t.k,t.id)?null:t; render();
      if(picTarget) toast("Giờ nhấn Ctrl+V để dán ảnh cho "+picName(picTarget));
    };
    b.ondragover=e=>{ e.preventDefault(); b.classList.add("drop"); };
    b.ondragleave=()=>b.classList.remove("drop");
    b.ondrop=e=>{ e.preventDefault(); b.classList.remove("drop");
      const f=e.dataTransfer?.files?.[0];
      if(f&&f.type.startsWith("image")) applyPic(t,f); };
  });
}
document.addEventListener("paste",e=>{
  if(!isAdmin||!picTarget) return;
  for(const it of (e.clipboardData?.items||[])){
    if(it.type&&it.type.startsWith("image")){
      const f=it.getAsFile();
      if(f){ e.preventDefault(); applyPic(picTarget,f); return; }
    }
  }
  toast("Clipboard không có ảnh — copy ảnh rồi thử lại.");
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&picTarget){ picTarget=null; render(); } });
document.getElementById("av-file").onchange=e=>{
  const f=e.target.files[0]; if(f&&picTarget) applyPic(picTarget,f); e.target.value=""; };
document.getElementById("qr-file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{ const im=new Image(); im.onload=()=>{
    const max=480; let w=im.width,h=im.height;
    if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(im,0,0,w,h);
    try{ st.qr=cv.toDataURL("image/jpeg",0.85); }catch(err){ st.qr=ev.target.result; }
    act("Cập nhật mã QR"); render(); }; im.src=ev.target.result; };
  rd.readAsDataURL(f); e.target.value="";
};
document.getElementById("json-file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    let next;
    try{ next=migrate(JSON.parse(ev.target.result)); }
    catch(err){ alert("File không hợp lệ: "+err.message); return; }
    if(!confirm(`Nhập ${next.sessions.length} buổi / ${next.members.length} người?\nSổ trên web sẽ bị ghi đè.`))return;
    st=next; sel.clear(); openMember=null; editingId=null; draft=null; picTarget=null;
    act(`Nhập dữ liệu từ file JSON: ${st.sessions.length} buổi / ${st.members.length} người`);
    render(); toast("Đã nhập — đang lưu lên web…");
  };
  rd.onloadend=()=>{ e.target.value=""; };
  rd.readAsText(f);
};
/* bản HTML tĩnh: dữ liệu nhúng sẵn, mở bằng file:// cũng chạy — phòng khi Vercel chết */
async function exportStatic(){
  try{
    const html=await (await fetch(location.pathname,{cache:"no-store"})).text();
    const inject=`<script>window.__DATA__=${JSON.stringify({rev,updatedAt,data:st}).replace(/<\//g,"<\\/")};<\/script>`;
    const out=html.replace("</head>",inject+"</head>");
    const b=new Blob([out],{type:"text/html"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="so-cau-long-tinh.html"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ alert("Không tạo được bản tĩnh: "+e.message); }
}

/* ---------- khởi động ---------- */
try{ const p=localStorage.getItem(PASS_KEY); if(p){ pass=p; isAdmin=true; } }catch(e){}
if(qs.has("admin")&&!isAdmin) setTimeout(loginDialog,300);
if(me) view="me";
boot();
</script>
